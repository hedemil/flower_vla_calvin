# FLOWERVLA (rectified-flow baseline) configuration.
# Default optimizer/scheduler = Recipe C (official FLOWER fine-tune config).
# See docs/calvin_configs_and_results.md. LIBERO pins its own optimizer/scheduler
# in conf/config_libero.yaml so this default does not change LIBERO results.
_target_: flower.models.flower.FLOWERVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False  # Freeze entire Florence model to save memory
freeze_vision_tower: False  # Freeze vision tower to save memory
vlm_prompt_style: default
token_dropout: 0.1  # Added token dropout parameter

# Model Structure
multistep: ${multistep}
num_sampling_steps: 4
lowdim_obs_dim: 7
action_dim: 7
act_window_size: 10

# pretraining stuff
load_pretrained: False
pretrained_model_path: ./checkpoints/pretrained/360000_model_weights.pt
# Model flags
use_second_view: True  # Disable second view to save memory
second_view_key: image_wrist
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false
use_readout_token: false
use_proprio: false
return_act_chunk: false

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 18
attn_pdrop: 0.1
resid_pdrop: 0.1
mlp_pdrop: 0.1

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 120
rope_theta: 32.0

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05            # Recipe C
  # vlm_weight_decay omitted -> code falls back to transformer_weight_decay (0.05)
  learning_rate: 5e-5                       # Recipe C peak LR
  vlm_lr_scale: 1.0                         # Recipe C
  betas: [0.9, 0.95]

# Learning Rate Scheduler (Recipe C)
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.1
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 5e-5