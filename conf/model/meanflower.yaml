# MeanFlowerVLA Configuration (Mean Flow variant of FLOWERVLA)
_target_: flower.models.meanflower.MeanFlowerVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False
freeze_vision_tower: False
freeze_embeddings_only: False
vlm_prompt_style: default
token_dropout: 0.1
cfg_dropout: 0.1

# Model Structure
multistep: ${multistep}
num_sampling_steps: 1  # Mean Flow uses single-step sampling
lowdim_obs_dim: 7
action_dim: 7
act_window_size: 10

# Pretrained weights (set to load from a FLOWERVLA checkpoint for fine-tuning)
load_pretrained: False
pretrained_model_path: null

# Model flags
use_second_view: True
second_view_key: image_wrist
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false
use_readout_token: false
use_proprio: false
return_act_chunk: false

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 18
attn_pdrop: 0.0
resid_pdrop: 0.0
mlp_pdrop: 0.0

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 100
rope_theta: 32.0

# Mean Flow Configuration
noise_dist: logit_normal
P_mean: -2.0 # -0.4 for ImageNet 256 -2.0 for CIFAR10
P_std: 2.0 # 1.0 for ImageNet 256, 2.0 for CIFAR10
ratio: 0.75

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  learning_rate: 2e-5
  betas: [0.9, 0.95]

# Learning Rate Scheduler
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.5
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 2e-5
