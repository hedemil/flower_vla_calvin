# Decoupled MeanFlowerVLA Configuration
# Splits DiT blocks into encoder (conditioned on t) and decoder (conditioned on r)
# for improved single-step sampling via flow map conversion.
# See: "Decoupled MeanFlow" (arxiv 2510.24474)
_target_: flower.models.meanflower.MeanFlowerVLA
_recursive_: false

# VLM Configuration
vlm_path: microsoft/Florence-2-large
freeze_florence: False
freeze_vision_tower: False
freeze_embeddings_only: False
vlm_prompt_style: default
token_dropout: 0.1
cfg_dropout: 0.1

# Model Structure
multistep: ${multistep}
num_sampling_steps: 1  # Mean Flow uses single-step sampling
lowdim_obs_dim: 7
action_dim: 7
act_window_size: 10

# Pretrained weights (load from Phase 1 FLOWERVLA/MeanFlower checkpoint)
load_pretrained: False
pretrained_model_path: null

# Model flags
use_second_view: True
second_view_key: rgb_gripper
action_type_adaln: True
use_causal_attention: true
use_cross_attn: True
use_adaln_cond: false
use_readout_token: false
use_proprio: false
return_act_chunk: false

# DiT Configuration
sampling_type: uniform
dit_dim: 1024
n_heads: 16
n_layers: 18
attn_pdrop: 0.1
resid_pdrop: 0.1
mlp_pdrop: 0.1

# RoPE Configuration
use_rope: true
use_nope: false
query_seq_len: 100
rope_theta: 32.0

# Decoupled MeanFlow Configuration
encoder_depth: 14              # 14 encoder + 4 decoder blocks (out of 18)
use_combined_loss: true         # FM loss + MF loss per batch
freeze_encoder_blocks: false    # Joint optimization for best 1-step quality

# Mean Flow Configuration
noise_dist: logit_normal
P_mean: -0.4
P_std: 1.0
ratio: 0.75

# Optimizer Configuration
optimizer_type: adamw

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  learning_rate: 2e-5
  betas: [0.9, 0.95]

# Learning Rate Scheduler
lr_scheduler:
  lr_scheduler:
    init_lr: 2e-5
    init_lr_scale: 0.1
    final_lr_scale: 0.5
    total_steps: 50000
    phase_ratio: "(0.05, 0.1, 0.85)"
    lr: 2e-5
