defaults:
  - annotations: new_playtable_validation
  - callbacks/rollout_lh/tasks@tasks: new_playtable_tasks

eval_cfg_overwrite:
  datamodule:
    datasets:
      lang_dataset:
        lang_folder: lang_annotations
        batch_size: 1 # Added for latency during evaluation
  model:
    num_sampling_steps: ${num_sampling_steps}
  trainer:
    precision: bf16-mixed # Added for latency during evaluation

train_folder: ./checkpoints/flower/calvin_abcd/.hydra/config.yaml
checkpoint: ./checkpoints/flower/calvin_abcd/model.ckpt
device: 0


log_dir: ./logs/
dataset_path: ./dataset/task_D_D
num_videos: 30
debug: False

log_wandb: True
wandb_entity: bennoq

num_sequences: 100
ep_len: 360
num_sampling_steps: 4
multistep: 10
use_bf16: true

# Dump executed per-step action streams to rollout_actions.jsonl for
# trajectory-smoothness analysis (tools/results/calvin_smoothness.py). Off by
# default; enable on the reduced re-run with log_actions=true.
log_actions: false

# Inference-time action smoothing for the iMF jitter study (off by default;
# combine with log_actions=true to measure the effect). fix_chunk_noise reuses
# one sampling-noise tensor across chunks within a rollout, removing the
# stochastic jump at chunk boundaries at zero extra cost.
fix_chunk_noise: false